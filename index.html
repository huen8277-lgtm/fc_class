  <style>
    :root{
      --bg:#070b16; --bg2:#0b1020; --panel:rgba(13,18,34,.84); --panel2:rgba(18,25,46,.92);
      --card:#141b33; --line:#25304f; --line2:#334268; --text:#eef3ff; --muted:#9aa6c6; --muted2:#7582a6;
      --accent:#7c9cff; --accent2:#69e0c8; --good:#7fe2ad; --warn:#ffd36a; --bad:#ff8f8f;
      --shadow:0 20px 60px rgba(0,0,0,.30); --radius:20px;
    }
    *{box-sizing:border-box}
    html,body{height:auto;min-height:100%;overflow-x:hidden;overflow-y:auto}
    body{
      margin:0;color:var(--text);
      font-family:Inter,Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",Arial,sans-serif;
      background:
        radial-gradient(1200px 700px at 10% 0%, rgba(124,156,255,.15), transparent 60%),
        radial-gradient(900px 500px at 100% 0%, rgba(105,224,200,.10), transparent 52%),
        linear-gradient(180deg, var(--bg) 0%, #090d1a 100%);
      overflow-x:hidden;overflow-y:auto;
    }
    .app{display:grid;grid-template-columns:1fr;min-height:100vh}
    .main{display:flex;flex-direction:column;min-width:0;overflow:visible}
    .hero{padding:14px 16px 10px;border-bottom:1px solid rgba(255,255,255,.06);background:linear-gradient(180deg, rgba(10,14,28,.94), rgba(10,14,28,.74));}

    h1{margin:0 0 8px;font-size:26px;line-height:1.15;letter-spacing:-.04em}
    .subtitle{color:var(--muted);font-size:13px;line-height:1.55;max-width:1040px}
    .file-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
    .pill{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);font-size:11px;color:#d9e2ff;font-weight:700;white-space:nowrap}

    .pill.accent{background:rgba(124,156,255,.14);border-color:rgba(124,156,255,.28);color:#d8e4ff}
    .pill.warn{background:rgba(255,211,106,.12);border-color:rgba(255,211,106,.28);color:#ffe18f}
    .right-note{color:var(--muted2);font-size:12px;line-height:1.55;max-width:320px}
    .toolbar{margin-top:12px;padding:12px;border:1px solid rgba(255,255,255,.06);border-radius:18px;background:rgba(255,255,255,.02);box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}

    .search{min-width:260px;display:flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);border-radius:14px;padding:9px 12px;flex:1;max-width:560px}
    .search input{width:100%;border:none;outline:none;background:transparent;color:var(--text);font-size:13px}
    .search input::placeholder{color:#64719a}
    .btn{border:none;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer;transition:.18s ease;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:13px;white-space:nowrap}
    .btn.primary{background:linear-gradient(135deg, var(--accent), #9aaeff);color:#081022;box-shadow:0 10px 24px rgba(124,156,255,.18)}
    .btn.ghost{background:rgba(255,255,255,.04);color:var(--text);border:1px solid rgba(255,255,255,.08)}
    .btn:hover{transform:translateY(-1px)}
    input[type=file]{display:none}
    .meta-strip{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .tiny{font-size:11px;color:var(--muted2)}

    .content{padding:12px 14px 14px;min-height:0;overflow:visible}
    .table-tools{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
    .tool-left,.tool-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
    .tool-left{flex:1}
    .tool-right{justify-content:flex-end;flex:1}
    .rules-strip{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:0 0 10px;padding:8px 10px;border-radius:14px;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.02)}
    .rules-line{display:flex;gap:8px;flex-wrap:wrap;align-items:center;min-width:0}
    .rule-text{display:inline-flex;align-items:center;padding:6px 9px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);font-size:10px;line-height:1.2;color:#dbe5ff;white-space:nowrap}
    .rule-text strong{color:#fff}
    .rules-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

    .grid{display:grid;grid-template-columns:minmax(0,1fr) 346px;gap:14px;min-height:0;align-items:start}
    .card{background:linear-gradient(180deg, rgba(18,25,46,.95), rgba(12,16,28,.9));border:1px solid rgba(255,255,255,.06);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;min-width:0}

    .grid{display:grid;grid-template-columns:minmax(0,1fr) 346px;gap:14px;min-height:0;align-items:start}
    .card{background:linear-gradient(180deg, rgba(18,25,46,.95), rgba(12,16,28,.9));border:1px solid rgba(255,255,255,.06);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;min-width:0}
    .card .head{padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:rgba(255,255,255,.015)}

    .tab.active{color:#081022;background:linear-gradient(135deg, var(--accent2), #c8fff3);border-color:transparent}

    table{min-width:1680px;width:max-content;border-collapse:separate;border-spacing:0;font-size:11px}
    thead tr{position:sticky;top:0;z-index:40}
    thead th{position:relative;background:rgba(20,27,51,.98);backdrop-filter:blur(8px);color:#dbe5ff;text-align:left;padding:8px 8px;border-bottom:1px solid rgba(255,255,255,.06);white-space:nowrap}
    thead th:nth-child(1){position:sticky;top:0;left:0;min-width:84px;width:84px;z-index:45}
    thead th:nth-child(2){position:sticky;top:0;left:84px;min-width:190px;width:190px;z-index:45}

    tbody td:nth-child(1){position:sticky;left:0;z-index:22;white-space:nowrap;max-width:84px;min-width:84px;width:84px}
    tbody td:nth-child(2){position:sticky;left:84px;z-index:22;white-space:nowrap;max-width:190px;min-width:190px;width:190px}

    tbody td:nth-child(1){
      font-weight:800;
      text-align:center;
      color:#fff;
    }
    tbody td:nth-child(1):has-text{}

    .pos-mid{background:#4CAF50!important}
    .pos-def{background:#2196F3!important}
    .pos-gk{background:#795548!important}

    tbody tr:hover td{background:rgba(124,156,255,.07)}
    tbody tr.selected td{background:rgba(105,224,200,.09)}
    .cell-pre{white-space:pre-line;line-height:1.4;word-break:break-word}
    .cell-pre.compact{white-space:normal;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:360px}
    .cell-pre.one-line{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.15;display:block;max-width:100%}
    .chips{display:flex;gap:4px;flex-wrap:nowrap;overflow-x:auto;white-space:nowrap;align-items:center;scrollbar-width:none;max-width:100%}.chips::-webkit-scrollbar{display:none}.trait-inline{max-width:100%;overflow:hidden}
    .chip{display:inline-flex;align-items:center;padding:4px 7px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);font-size:10px;line-height:1.05;flex:0 0 auto;white-space:nowrap;font-weight:500}
    .chip.bold{font-weight:500;color:#fff;border-color:rgba(124,156,255,.5);background:rgba(124,156,255,.16)}
    .chip.unused{color:#9aa6c6;opacity:.82;background:rgba(255,255,255,.03)}

    .grade.Splus{background:rgba(105,224,200,.18);color:#8effd9;border:1px solid rgba(105,224,200,.35)}
    .grade.S{background:rgba(124,156,255,.16);color:#d7e3ff;border:1px solid rgba(124,156,255,.35)}
    .grade.Aplus{background:rgba(255,211,106,.15);color:#ffe18f;border:1px solid rgba(255,211,106,.34)}
    .grade.A{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.12)}
    .grade.B{background:rgba(255,255,255,.06);color:#d2d9ef;border:1px solid rgba(255,255,255,.08)}
    .grade.C{background:rgba(255,143,143,.14);color:#ffb2b2;border:1px solid rgba(255,143,143,.28)}
    .ability{font-weight:400;letter-spacing:-.01em}
    .ability-gray{color:#9CA3AF}
    .ability-sky{color:#4FC3F7}
    .ability-blue{color:#3B82F6}
    .ability-indigo{color:#6366F1}
    .ability-purple{color:#8B5CF6}
    .ability-magenta{color:#D946EF}
    .ability-red{color:#FF3B30}
    .ability-gold{color:#FFD60A}
    .ability-orange{color:#FF9F0A}
    .ability-teal{color:#00C7BE}

    .detail-ovr-badge{background:rgba(124,156,255,.22);border-color:rgba(124,156,255,.45);color:#ecf2ff;font-weight:900;box-shadow:0 10px 20px rgba(124,156,255,.14)}

    .detail .body{display:grid;gap:12px;max-height:calc(100vh - 145px);overflow:auto}
    .detail .body::-webkit-scrollbar{width:10px}

    .detail .body::-webkit-scrollbar-track{background:transparent}
    .detail-name{font-size:22px;font-weight:900;letter-spacing:-.04em;line-height:1.15;min-width:0;max-width:100%;word-break:keep-all;overflow-wrap:anywhere}
    .detail-eval{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
    .detail-eval .grade{font-size:13px;padding:5px 9px}
    .detail-eval-text{font-size:12px;color:var(--muted);line-height:1.45;font-weight:600;min-width:0}
    .detail-sub{color:var(--muted);font-size:12px;line-height:1.5}
    .detail-box{padding:12px;border-radius:16px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06)}
    .detail-box h3{margin:0 0 8px;font-size:13px}
    .detail-box ul{margin:0;padding-left:18px;color:#eef3ff;line-height:1.62;font-size:12px}
    .detail-box li{margin:2px 0}

    .detail-shell{display:grid;gap:12px}
    .detail-top{display:block;padding:2px 2px 0}

    .detail-kicker{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted2);font-weight:800}
    .detail-name-row{display:grid;grid-template-columns:1fr;gap:10px;align-items:start;min-width:0;width:100%}
    .detail-head-badges{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start;justify-content:flex-start;max-width:100%;padding-top:2px}
    .detail-mini-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
    .detail-mini{padding:10px 11px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);min-width:0}

    .detail-mini .v{font-size:16px;font-weight:900;letter-spacing:-.03em;line-height:1.1}

    .detail-eval-text{display:grid;gap:3px;min-width:0;max-width:100%;font-size:13px;line-height:1.8;font-weight:500;color:var(--muted);white-space:normal;word-break:keep-all}
    .detail-eval-text div{min-width:0}
    .detail-panel{display:grid;gap:12px}
    .detail-section + .detail-section{margin-top:0}
    .detail-ability-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}

    .detail-section h3{margin:0 0 10px;font-size:13px;letter-spacing:-.02em}

    /* v30 polish */

<body>
  <div class="app">
    <main class="main">
      <div class="hero">
        <div class="title-row">
          <div>
            <h1>클래스 대장 · FC ONLINE 엑셀 즉시 분석기</h1>
            <div class="subtitle">업로드한 엑셀을 브라우저에서 바로 읽어, 요청한 규칙대로 컬럼을 재배치하고 Trait를 해독하며, 실사용 관점의 선수 평가와 클래스 총평까지 함께 보여줍니다.</div>
            <div class="file-meta">
              <span class="pill good" id="loadedPill" style="display:none;">파일 로드됨</span>
              <span class="pill" id="modePill">가공 결과 보기</span>
              <span class="pill" id="rowPill"></span>
              <span class="pill" id="avgPill"></span>
              <span class="pill accent" id="enginePill">오프라인 HTML / 공식 선수명</span>
            </div>
          </div>
          <div class="right-note" id="hintText">업로드 후 자동 처리됩니다. 대량 파일도 전체 행을 바로 렌더링합니다.</div>
        </div>
      </div>

      <div class="content">
        <div class="grid">
          <section class="card">
            <div class="head">
              <h2>결과 테이블</h2>
              <div class="top-tools" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
                
              </div>
            </div>
            <div class="body">
              <div class="table-tools">
                <div class="tool-left">
                  <label class="btn primary" for="file">엑셀 첨부</label>
                  <input id="file" type="file" accept=".xlsx,.xlsm,.xls,.xlsb" />
                  <div class="controls">
                    <label class="control"><span class="lbl">강화등급</span><span class="control-wrap"><select id="enhanceSelect">
                      <option value="1">1카</option><option value="2">2카</option><option value="3">3카</option><option value="4">4카</option><option value="5">5카</option><option value="6">6카</option><option value="7">7카</option><option value="8">8카</option><option value="9">9카</option><option value="10">10카</option><option value="11">11카</option><option value="12">12카</option><option value="13">13카</option>
                    </select></span></label>
                    <label class="control"><span class="lbl">적응도</span><span class="control-wrap"><select id="adaptSelect">
                      <option value="1" selected>Lv1</option><option value="5">Lv5</option>
                    </select></span></label>
                    <label class="control"><span class="lbl">팀컬러</span><span class="control-wrap"><select id="teamColorSelect">
                      <option value="0">팀컬러</option><option value="1">+1</option><option value="2">+2</option><option value="3">+3</option><option value="4">+4</option><option value="5">+5</option><option value="6">+6</option><option value="7">+7</option><option value="8">+8</option><option value="9">+9</option><option value="10">+10</option>
                    </select></span></label>
                  </div>
                </div>
                <div class="tool-right" style="flex:1;justify-content:flex-end;">
                  <div class="search"><span style="color:var(--muted2);font-size:12px;white-space:nowrap;">검색</span><input id="search" placeholder="이름, 특성, 평가 내용 검색" /></div>
                  <button class="btn ghost" id="downloadBtn" type="button">CSV 다운로드</button>
                </div>
              </div>

              <div class="tabs">
                <button class="tab active" id="tabProcessed">가공 결과</button>
                <button class="tab" id="tabRaw">원본 매핑</button>
                <button class="tab" id="tabSummary">클래스 총평</button>
              </div>

              <div id="tableWrap" class="table-wrap">
                <div class="empty">엑셀 파일을 업로드하면 가공 결과가 여기에 즉시 표시됩니다.</div>
              </div>
            </div>
          </section>

          <aside class="card detail">
            <div class="head"><h2>선택 행 상세</h2><span class="pill accent" id="detailPill">대기</span></div>
            <div class="body" id="detailBox">
              <div class="empty" style="padding:10px 4px 2px;">행을 클릭하면 해당 선수의 가공값, 비교 클래스, 투자 관점을 상세히 보여줍니다.</div>
            </div>
          </aside>
        </div>
      </div>
    </main>
  </div>

  <script src="player_name_map.js"></script>
  <script src="app.js"></script>
